name: 功能建议
description: 提出新能力或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景。大改动建议先讨论再实现。
  - type: dropdown
    id: repo
    attributes:
      label: 相关仓库
      options:
        - mugsun-boot
        - mugsun-core
        - mugsun-pc
        - mugsun-track
        - mugsun-docs
        - mugsun-app
        - mugsun-uniappx-ui
        - mugsun-uniappx-sdk
        - 其他 / 不确定
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前痛点或缺失能力
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望怎么做；有无替代方案也可写
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充
      description: 关联 Issue、原型、竞品参考等
    validations:
      required: false
