name: 缺陷报告
description: 描述可复现的错误
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索是否已有相同 Issue。安全漏洞请勿使用本模板，见 [SECURITY.md](https://github.com/mugsun/.github/blob/main/SECURITY.md)。
  - type: dropdown
    id: repo
    attributes:
      label: 相关仓库
      options:
        - mugsun-boot
        - mugsun-core
        - mugsun-pc
        - mugsun-track
        - mugsun-docs
        - mugsun-app
        - mugsun-uniappx-ui
        - mugsun-uniappx-sdk
        - 其他 / 不确定
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 如 Maven / npm / 镜像 tag，或 commit SHA
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际结果是什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
      description: 你期望发生什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量写成别人可照做的步骤
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 系统
      description: 请写清楚 OS（含版本）、JDK / Node 版本、浏览器（含版本），部署方式可一并写上
      placeholder: |
        OS：macOS 15.1
        JDK / Node：JDK 21 / Node 22
        浏览器：Chrome 130
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      render: shell
    validations:
      required: false
